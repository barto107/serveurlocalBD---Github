<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Catalogue de Bandes Dessinées</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .search-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .search-container input, .search-container select {
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin: 5px;
        }
        .search-container input {
            width: 250px;
        }
        .search-container select {
            width: 200px;
        }
        .search-container button {
            padding: 10px 15px;
            font-size: 1em;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
        .search-container button:hover {
            background-color: #2980b9;
        }
        .series-container {
            margin-bottom: 40px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .series-title {
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            color: #2980b9;
            margin-top: 0;
        }
        .albums-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
        }
        .album-card {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 200px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .album-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #eee;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .album-card img:hover {
            opacity: 0.85;
        }
        .album-title {
            font-weight: bold;
            font-size: 0.95em;
            margin: 10px 0 5px 0;
            text-align: center;
        }
        .album-summary {
            font-size: 0.8em;
            color: #666;
            max-height: 80px;
            overflow-y: auto;
            margin-bottom: 5px;
        }
        .album-genre {
            font-size: 0.75em;
            background-color: #e1f5fe;
            color: #0288d1;
            padding: 3px 6px;
            border-radius: 4px;
            text-align: center;
            margin-top: 5px;
            font-weight: bold;
        }
        .album-btn {
            display: block;
            text-align: center;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        .album-btn:hover {
            background-color: #219653;
        }

        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            cursor: default;
        }
    </style>
</head>
<body>

    <h1>Mon Catalogue de Bandes Dessinées</h1>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Rechercher une série...">
        <select id="genreFilter">
            <option value="">Tous les genres</option>
        </select>
        <button id="resetBtn">Réinitialiser</button>
    </div>

    <div id="catalog">Chargement du catalogue...</div>

    <div id="lightbox">
        <img id="lightbox-img" src="" alt="Aperçu grand format">
    </div>

    <script>
        let fullData = {};

        fetch('comics.json')
            .then(response => response.json())
            .then(data => {
                fullData = data;
                populateGenreFilter(fullData);
                buildCatalogDOM(fullData);
            })
            .catch(error => {
                document.getElementById('catalog').textContent = 'Erreur lors du chargement du fichier comics.json.';
                console.error(error);
            });

        function populateGenreFilter(data) {
            const genresSet = new Set();
            for (const albums of Object.values(data)) {
                albums.forEach(album => {
                    if (album.genre && album.genre !== "Inconnu") {
                        const parts = album.genre.split(/[\/,;]+/).map(g => g.trim());
                        parts.forEach(part => {
                            if (part.length > 0) {
                                const formatted = part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
                                genresSet.add(formatted);
                            }
                        });
                    }
                });
            }
            
            const sortedGenres = Array.from(genresSet).sort();
            const genreSelect = document.getElementById('genreFilter');
            sortedGenres.forEach(genre => {
                const option = document.createElement('option');
                option.value = genre;
                option.textContent = genre;
                genreSelect.appendChild(option);
            });
        }

        function buildCatalogDOM(data) {
            const catalogDiv = document.getElementById('catalog');
            catalogDiv.innerHTML = '';

            const entries = Object.entries(data);
            if (entries.length === 0) {
                catalogDiv.innerHTML = '<p style="text-align:center; color:#666;">Aucune série trouvée.</p>';
                return;
            }

            for (const [seriesName, albums] of entries) {
                const seriesSection = document.createElement('div');
                seriesSection.className = 'series-container';
                seriesSection.dataset.series = seriesName.toLowerCase();

                const seriesHeader = document.createElement('h2');
                seriesHeader.className = 'series-title';
                seriesHeader.textContent = seriesName;
                seriesSection.appendChild(seriesHeader);

                const albumsGrid = document.createElement('div');
                albumsGrid.className = 'albums-grid';

                albums.forEach(album => {
                    const card = document.createElement('div');
                    card.className = 'album-card';
                    card.dataset.genre = album.genre ? album.genre.toLowerCase() : "";

                    const img = document.createElement('img');
                    // Détecte automatiquement si on est sur GitHub Pages ou en local pour adapter le chemin
const isGitHubPages = window.location.hostname.includes('github.io');
const repoName = isGitHubPages ? '/' + window.location.pathname.split('/')[1] : '';
img.src = album.cover ? repoName + '/' + album.cover : '';
                    img.alt = album.title;
                    img.onerror = () => { 
    img.style.display = 'none'; // Cache l'image cassée
    // Optionnel : affiche un message de remplacement propre
    if (!card.querySelector('.no-cover-text')) {
        const noCover = document.createElement('div');
        noCover.className = 'no-cover-text';
        noCover.style.cssText = 'height:280px; display:flex; align-items:center; justify-content:center; background:#eee; color:#666; font-size:0.9em; text-align:center; border-radius:4px;';
        noCover.textContent = 'Pas de couverture';
        card.insertBefore(noCover, card.firstChild);
    }
};
                    
                    img.addEventListener('click', () => {
                        if (album.cover) {
                            document.getElementById('lightbox-img').src = album.cover;
                            document.getElementById('lightbox').style.display = 'flex';
                        }
                    });

                    card.appendChild(img);

                    const title = document.createElement('div');
                    title.className = 'album-title';
                    title.textContent = album.title;
                    card.appendChild(title);

                    const summary = document.createElement('div');
                    summary.className = 'album-summary';
                    summary.textContent = album.summary;
                    card.appendChild(summary);

                    if (album.genre && album.genre !== "Inconnu") {
                        const genreDiv = document.createElement('div');
                        genreDiv.className = 'album-genre';
                        genreDiv.textContent = album.genre;
                        card.appendChild(genreDiv);
                    }

					// Bouton pour copier le chemin du fichier dans le presse-papiers
					const openBtn = document.createElement('button');
					openBtn.className = 'album-btn';
					openBtn.textContent = 'Copier le chemin';
					const filePath = `\\\\TNAS-BD\\barto107\\bd\\${seriesName}\\${album.filename}`;

openBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(filePath).then(() => {
        openBtn.textContent = 'Chemin copié !';
        openBtn.style.backgroundColor = '#2980b9';
        setTimeout(() => {
            openBtn.textContent = 'Copier le chemin';
            openBtn.style.backgroundColor = '#27ae60';
        }, 2000);
    }).catch(err => {
        console.error('Erreur lors de la copie :', err);
    });
});
card.appendChild(openBtn);

                    albumsGrid.appendChild(card);
                });

                seriesSection.appendChild(albumsGrid);
                catalogDiv.appendChild(seriesSection);
            }
        }

        function filterCatalog() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedGenre = document.getElementById('genreFilter').value.toLowerCase();
            
            const seriesSections = document.querySelectorAll('.series-container');

            seriesSections.forEach(section => {
                const seriesName = section.dataset.series;
                const matchSeries = seriesName.includes(searchTerm);
                
                let visibleAlbumsCount = 0;
                const cards = section.querySelectorAll('.album-card');

                cards.forEach(card => {
                    const cardGenre = card.dataset.genre;
                    const matchGenre = selectedGenre === "" || cardGenre.includes(selectedGenre);

                    if (matchGenre) {
                        card.style.display = 'flex';
                        visibleAlbumsCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                if (matchSeries && visibleAlbumsCount > 0) {
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            });
        }

        document.getElementById('searchInput').addEventListener('input', filterCatalog);
        document.getElementById('genreFilter').addEventListener('change', filterCatalog);

        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('genreFilter').value = '';
            filterCatalog();
        });

        const lightbox = document.getElementById('lightbox');
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.style.display = 'none';
            }
        });
    </script>

</body>
</html>
